# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: forgeguard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/forgeguard.db
      - key: WORKSPACE_ROOT
        value: /workspace
      - key: WORKSPACE_RETENTION_HOURS
        value: "0"
      - key: DEMO_MODE
        value: "false"
      - key: MAX_REPAIR_CYCLES
        value: "2"
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: DODO_API_KEY
        sync: false
      - key: DODO_WEBHOOK_SECRET
        sync: false
      - key: DODO_PRODUCT_DEVELOPER
        sync: false
      - key: DODO_PRODUCT_PRO
        sync: false
      - key: DODO_PRODUCT_TEAM
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
      - key: ALLOWED_REPOS
        sync: false
    disk:
      name: forgeguard-data
      mountPath: /data
      sizeGB: 1
